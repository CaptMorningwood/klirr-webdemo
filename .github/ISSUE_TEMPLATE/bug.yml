name: Bug
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: observed
    attributes: {label: Observed behavior}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected behavior}
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes: {label: Reproduction steps and environment, description: Remove secrets and personal or production data.}
    validations: {required: true}
  - type: textarea
    id: impact
    attributes: {label: Impact, regression, and data/privacy risk}
  - type: textarea
    id: evidence
    attributes: {label: Safe evidence, description: Do not attach credentials, personal data, production data, or sensitive logs.}
